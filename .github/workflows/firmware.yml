name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host firmware checks
        run: make -C firmware/host && cd firmware/host && ./verify
      - uses: astral-sh/setup-uv@v6
      - name: Python checks
        run: >-
          uv run --python 3.12 python -m unittest
          test_morphoscan_protocol test_morphoscan_body test_flash_config
          test_flash_setup test_notice test_package_release test_receiver test_screens
      - name: Web installer checks
        run: node --test web/config.test.mjs

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF v5.5.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: firmware
      - name: Package firmware
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('main-{0}', github.sha) }}
        run: python3 firmware/package_release.py firmware/build dist "${VERSION:0:64}"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/renpho-relay-firmware-*.zip
          fail_on_unmatched_files: true

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - name: Assemble the web installer
        run: |
          mkdir site
          cp web/index.html web/installer.js web/config.js site/
          cp -r dist/firmware site/firmware
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
